name: Deploy Node.js Website

on:
  push:
    branches:
      - website
    paths:
      - 'website_node/**'
      - '.github/workflows/deploy-node.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Generate package-lock.json for caching
        working-directory: ./website_node
        run: npm install --package-lock-only
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: 'npm'
          cache-dependency-path: website_node/package-lock.json
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Install dependencies
        working-directory: ./website_node
        run: npm ci

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./website_node/public
  
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
